services:
  - type: web
    name: nrstudio-api
    runtime: node
    rootDir: api
    plan: starter
    buildCommand: npm ci && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: "Administradora NR Studio"
      - key: ADMIN_EMAIL
        value: "admin@nrstudio.com.br"
      - key: ADMIN_PASSWORD
        sync: false
